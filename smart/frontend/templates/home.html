<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library | Dashboard</title>
    <style>
        :root {
            /* REFINED COOL COLOR PALETTE */
            --primary: #4f46e5;          /* Deep Indigo */
            --accent: #818cf8;           /* Light Indigo */
            --text-main: #e2e8f0;       /* Cool Gray */
            --text-muted: #94a3b8;      /* Mid-tone Gray */
            --bg-glass: rgba(15, 23, 42, 0.6); /* Translucent Slate */
            --border-glass: rgba(148, 163, 184, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a; /* Fallback for older browsers */
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                              url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?q=80&w=2070"); /* New, atmospheric background */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- STYLISH & TRANSLUCENT NAVBAR --- */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            height: 70px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* --- WELCOME & HEADER SECTION --- */
        #home {
            padding-top: 150px; /* Account for floating navbar */
            text-align: center;
        }

        .welcome h1 {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
            animation: fadeInUp 0.9s ease forwards; /* Add entry animation */
        }

        .welcome p {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            animation: fadeInUp 1.2s ease forwards; /* Add staggered entry */
        }

        /* --- UNIQUE SLIDER: "SLOW REVEAL" & "KEN BURNS EFFECT" --- */
        .slider-container {
            width: 85%;
            max-width: 1150px;
            height: 550px; /* Slightly larger for a dramatic feel */
            margin: 0 auto 60px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-glass);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeInSlider 1.5s ease forwards; /* Fade in the entire slider */
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.8s ease-in-out; /* Slow and smooth cross-dissolve */
            overflow: hidden;
        }

        /* KEN BURNS EFFECT (ZOOM IN) */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            transition: transform 7s linear; /* Smooth, linear zoom-in over time */
        }

        .slide.active {
            opacity: 1;
        }

        .slide.active img {
            transform: scale(1.18); /* Max zoom reached during active state */
        }

        /* Gradual Bottom Gradient for improved readability */
        .slider-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(15,23,42,0.8), transparent);
            z-index: 2;
        }

        /* SLIDER DOTS NAVIGATION */
        .dots {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .dot.active {
            background: var(--accent);
            transform: scale(1.3); /* Slightly larger when active */
        }

        /* --- DYNAMIC ADDED ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInSlider {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            .navbar { width: 95%; top: 10px; }
            .welcome h1 { font-size: 2.6rem; }
            .nav-links { display: none; } /* Consider adding a mobile menu button */
            .slider-container { height: 350px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">📚 SMART LIB</div>
    <div class="nav-links">
        <a href="{{ url_for('books.view_books') }}" class="btn btn-primary">View Books</a>
        <a href="{{ url_for('auth.notification') }}">Notifications</a>
        <a href="{{ url_for('auth.logout') }}" style="color: #f87171;">Logout</a>
    </div>
</nav>

<section id="home">
    <div class="welcome">
        <h1>Welcome to Smart Library</h1>
        <p>Your Intelligent Hub for Books, Records, and Predictive Analysis</p>
    </div>

    <div class="slider-container">
        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1568667256549-094345857637?q=80&w=2070" alt="Modern Smart Library Interior">
        </div>
        <div class="slide">
            <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=2070" alt="Organized Digital Book Stacks">
        </div>
        <div class="slide">
            <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=2070" alt="Research & Data Tracking">
        </div>
        
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</section>

<script>
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    let current = 0;

    function changeSlide(nextIndex) {
        // Find previous active index
        let previous = current;

        // Reset the zoom transformation on the previous image immediately after it fades out.
        // This ensures it starts fresh when it becomes active again.
        const prevImg = slides[previous].querySelector('img');
        setTimeout(() => {
            prevImg.style.transform = "scale(1)"; 
        }, 1800); // Wait for the fade-out transition to complete (Match CSS transition-duration)

        // Remove active class from current (fade out)
        slides[previous].classList.remove("active");
        dots[previous].classList.remove("active");

        // Activate new index (fade in and start zoom)
        current = nextIndex;
        slides[current].classList.add("active");
        dots[current].classList.add("active");
    }

    // Auto-play timer (Increased time to enjoy the zoom effect)
    setInterval(() => {
        let next = (current + 1) % slides.length;
        changeSlide(next);
    }, 6500); // 6.5 seconds per slide (7s CSS zoom gives 0.5s transition buffer)

    // Manual dot navigation
    dots.forEach((dot, i) => {
        dot.addEventListener("click", () => {
            // Avoid resetting if clicking on the already active dot
            if (i === current) return;
            changeSlide(i);
        });
    });
</script>

</body>
</html>
