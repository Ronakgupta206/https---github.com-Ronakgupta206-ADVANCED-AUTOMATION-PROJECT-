<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <i class="fas fa-book-open text-indigo-600 text-xl"></i>
            <span class="text-xl font-bold text-slate-800 tracking-tight">Smart Library</span>
        </div>
        <div class="space-x-4">
            <a href="{{ url_for('auth.login') }}" class="text-slate-600 hover:text-indigo-600 font-medium transition-colors">Login</a>
            <a href="{{ url_for('auth.register') }}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-semibold shadow-md shadow-indigo-100 transition-all">Register</a>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center justify-between gap-12">
        <div class="md:w-1/2 text-center md:text-left">
            <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 leading-tight mb-6">
                Manage your Library <span class="text-indigo-600">Smarter.</span>
            </h1>
            <p class="text-lg text-slate-600 mb-8 leading-relaxed">
                Experience the next generation of library automation. Track books, manage members, and get AI-powered predictions all in one clean dashboard.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                <a href="{{ url_for('auth.register') }}" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all text-center">
                    Register Now
                </a>
                <!-- <a href="#" class="px-8 py-3 bg-white text-slate-700 border border-slate-200 rounded-xl font-bold hover:bg-slate-50 transition-all text-center">
                    Learn More
                </a> -->
            </div>
        </div>

    </main>

    <section class="bg-white py-12 border-y border-slate-200">
        <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 sm:grid-cols-3 gap-8 text-center">
            <div>
                <p class="text-3xl font-bold text-indigo-600">10k+</p>
                <p class="text-slate-500 font-medium">Books Managed</p>
            </div>
            <div>
                <p class="text-3xl font-bold text-indigo-600">5k+</p>
                <p class="text-slate-500 font-medium">Active Readers</p>
            </div>
            <div>
                <p class="text-3xl font-bold text-indigo-600">99%</p>
                <p class="text-slate-500 font-medium">Efficiency Rate</p>
            </div>
        </div>
    </section>

</body>
</html>
